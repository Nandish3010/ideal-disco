name: deploy-web
# Runs only after the "checks" workflow succeeded on a main push (or by hand): a red main never deploys.
on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$SHA^" "$SHA" | grep -qE '^web/'; then go=true; else go=false; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "deploy: $go"
  deploy:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/919512130399/locations/global/workloadIdentityPools/github/providers/gh-oidc
          service_account: corridor-ci@green-corridor-2026.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cd web && npm ci && npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
          VITE_MAPS_BROWSER_KEY: ${{ vars.VITE_MAPS_BROWSER_KEY }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      # Firestore rules are deployed manually with `firebase deploy --only firestore:rules`
      - name: Deploy to Firebase Hosting
        run: cd web && npx firebase-tools@latest deploy --only hosting --project green-corridor-2026 --non-interactive
