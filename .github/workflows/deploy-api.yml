name: deploy-api
# Runs only after the "checks" workflow succeeded on a main push (or by hand): a red main never deploys.
on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-api
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$SHA^" "$SHA" | grep -qE '^(api|data)/'; then go=true; else go=false; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "deploy: $go"
  deploy:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/919512130399/locations/global/workloadIdentityPools/github/providers/gh-oidc
          service_account: corridor-ci@green-corridor-2026.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bundle corridor data (the build context is api/)
        run: mkdir -p api/data && cp -r data/corridors data/scenarios api/data/
      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy corridor-api --source api --region asia-south1
          --project green-corridor-2026
          --allow-unauthenticated
          --service-account corridor-api@green-corridor-2026.iam.gserviceaccount.com
          --set-env-vars GCP_PROJECT=green-corridor-2026,GEMINI_MODEL=gemini-3.1-flash-lite,GEMINI_FALLBACK_MODEL=gemini-3-flash-preview,GEMINI_TEXT_MODEL=gemini-3-flash-preview,GEMINI_LOCATION=global
          --set-secrets MAPS_SERVER_KEY=corridor-maps-server-key:latest,HOUSEKEEPING_TOKEN=corridor-housekeeping-token:latest
          --memory 1Gi --min-instances 0 --max-instances 3 --no-cpu-throttling --quiet
      - name: Health check
        run: |
          url=$(gcloud run services describe corridor-api --region asia-south1 --project green-corridor-2026 --format='value(status.url)')
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/health")
          echo "GET $url/health -> $code"
          test "$code" = 200
