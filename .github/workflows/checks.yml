name: checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: attribution-gate
        run: |
          if grep -rIiEn --exclude-dir=.git --exclude-dir=node_modules '[c]laude|[a]nthropic|co-[a]uthored-by' .; then
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python api/acuity.py && python api/priority.py && python api/leadtime.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm install && npm run build
