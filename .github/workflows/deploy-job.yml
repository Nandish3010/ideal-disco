name: deploy-job
# Runs only after the "checks" workflow succeeded on a main push (or by hand): a red main never deploys.
on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$SHA^" "$SHA" | grep -qE '^(jobs/|Dockerfile\.job$|api/leadtime\.py$|data/corridors/|cloudbuild-job\.yaml$|\.github/workflows/deploy-job\.yml$)'; then go=true; else go=false; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "deploy: $go"
  deploy:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/919512130399/locations/global/workloadIdentityPools/github/providers/gh-oidc
          service_account: corridor-ci@green-corridor-2026.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: >
          gcloud builds submit --project green-corridor-2026 --region asia-south1
          --config cloudbuild-job.yaml --substitutions _TAG=${{ env.SHA }} .
      - name: Update job
        run: >
          gcloud run jobs update corridor-traffic-logger --project green-corridor-2026
          --region asia-south1
          --image asia-south1-docker.pkg.dev/green-corridor-2026/corridor/traffic-logger:${{ env.SHA }}
      - name: Run job once to verify
        run: >
          gcloud run jobs execute corridor-traffic-logger --region asia-south1
          --project green-corridor-2026 --wait
