name: deploy-job
on:
  push:
    branches: [main]
    paths:
      - "jobs/**"
      - "Dockerfile.job"
      - "api/leadtime.py"
      - "data/corridors/**"
      - "cloudbuild-job.yaml"
      - ".github/workflows/deploy-job.yml"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/919512130399/locations/global/workloadIdentityPools/github/providers/gh-oidc
          service_account: corridor-ci@green-corridor-2026.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: >
          gcloud builds submit --project green-corridor-2026 --region asia-south1
          --config cloudbuild-job.yaml --substitutions _TAG=${{ github.sha }} .
      - name: Update job
        run: >
          gcloud run jobs update corridor-traffic-logger --project green-corridor-2026
          --region asia-south1
          --image asia-south1-docker.pkg.dev/green-corridor-2026/corridor/traffic-logger:${{ github.sha }}
      - name: Run job once to verify
        run: >
          gcloud run jobs execute corridor-traffic-logger --region asia-south1
          --project green-corridor-2026 --wait
