# Builds the traffic logger job image from the repo root and pushes it to Artifact Registry.
# gcloud builds submit --config cloudbuild-job.yaml --substitutions _TAG=<tag> .
substitutions:
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.job
      - -t
      - asia-south1-docker.pkg.dev/green-corridor-2026/corridor/traffic-logger:$_TAG
      - -t
      - asia-south1-docker.pkg.dev/green-corridor-2026/corridor/traffic-logger:latest
      - .
images:
  - asia-south1-docker.pkg.dev/green-corridor-2026/corridor/traffic-logger:$_TAG
  - asia-south1-docker.pkg.dev/green-corridor-2026/corridor/traffic-logger:latest
