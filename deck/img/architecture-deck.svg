<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 968 428" width="968" height="428" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs>
<rect x="-4" y="-4" width="968" height="428" fill="#FFFFFF"/>
